{% extends 'base.html' %}
{% block content %}
<h2>Confirmar Remoção</h2>
<p>Tem certeza que deseja remover o post "{{ post.title }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar</button>
    <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
</form>
{% endblock %}
