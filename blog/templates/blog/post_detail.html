{% extends 'base.html' %}
{% block content %}
<article>
    <h2>{{ post.title }}</h2>
    <p><em>Publicado em: {{ post.post_date|date:"d/m/Y H:i" }}</em></p>
    <div>
        {{ post.content|safe }}
    </div>
    <div style="margin-top: 20px;">
        <a href="{% url 'post_update' post.pk %}">Editar</a> | 
        <a href="{% url 'post_delete' post.pk %}">Remover</a>
    </div>
</article>
{% endblock %}
