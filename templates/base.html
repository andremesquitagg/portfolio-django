{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>André Mesquita Gimenes</title>
</head>
<body>
    <header>
        <img src="{% static 'images/logo.jpg' %}" alt="logo">
        <h1>André Mesquita Gimenes</h1>
        <nav>
            <ul>
                <li><a href="{% url 'post_list' %}">Home</a></li>
                <li><a href="{% url 'post_create' %}">Novo Post</a></li>
                <li><a href="{% url 'category_list' %}">Categorias</a></li>
                {% if user.is_authenticated %}
                <li>
                    <form method="post" action="{% url 'logout' %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="link-button">Sair ({{ user.username }})</button>
                    </form>
                </li>
                {% else %}
                <li><a href="{% url 'login' %}">Entrar</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 André Mesquita Gimenes.</p>
    </footer>
</body>
</html>
